<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="pxdrik">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="feixe" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0.55" stop-color="#ffe680" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#ffd23f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilho" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="morcego" d="M0 -8 L4 -16 L6 -8 Q18 -14 30 -26 Q46 -18 60 -22 Q52 -10 54 4 Q44 -2 38 8 Q30 0 22 10 Q14 2 8 14 L0 22 L-8 14 Q-14 2 -22 10 Q-30 0 -38 8 Q-44 -2 -54 4 Q-52 -10 -60 -22 Q-46 -18 -30 -26 Q-18 -14 -6 -8 L-4 -16 Z"/>
    <style>
      .estrela { animation: piscar 3s ease-in-out infinite; }
      .e2 { animation-delay: 1s; } .e3 { animation-delay: 2s; }
      @keyframes piscar { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
      .sinal { animation: tremer 4s ease-in-out infinite; }
      @keyframes tremer { 0%,100% { opacity: 1 } 47% { opacity: 1 } 50% { opacity: .7 } 53% { opacity: 1 } }
      .janela { animation: luz 5s steps(1) infinite; }
      .j2 { animation-delay: 2.5s; }
      @keyframes luz { 0%,60% { opacity: 1 } 61%,100% { opacity: .15 } }
      .voo { animation: voar 14s linear infinite; }
      .voo2 { animation-duration: 19s; animation-delay: -7s; }
      @keyframes voar { from { transform: translate(-80px, 0) } to { transform: translate(1300px, -40px) } }
      .titulo { font-family: Impact, 'Arial Black', 'Helvetica Neue', sans-serif; }
      .texto { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#ceu)"/>

  <!-- estrelas -->
  <g fill="#e2e8f0">
    <circle class="estrela" cx="80" cy="40" r="1.4"/>
    <circle class="estrela e2" cx="210" cy="90" r="1"/>
    <circle class="estrela e3" cx="330" cy="30" r="1.3"/>
    <circle class="estrela" cx="460" cy="70" r="1"/>
    <circle class="estrela e2" cx="560" cy="25" r="1.5"/>
    <circle class="estrela e3" cx="640" cy="110" r="1"/>
    <circle class="estrela" cx="720" cy="45" r="1.2"/>
    <circle class="estrela e2" cx="1100" cy="35" r="1.4"/>
    <circle class="estrela e3" cx="1160" cy="120" r="1"/>
    <circle class="estrela" cx="1050" cy="150" r="1"/>
    <circle class="estrela e3" cx="140" cy="130" r="1"/>
    <circle class="estrela e2" cx="400" cy="140" r="1.1"/>
  </g>

  <!-- holofote -->
  <g class="sinal">
    <polygon points="1010,360 1050,360 990,140 820,120" fill="url(#feixe)"/>
    <ellipse cx="900" cy="105" rx="120" ry="78" fill="url(#halo)"/>
    <use href="#morcego" transform="translate(900 104) scale(1.45 1.3)" fill="#0b0f19"/>
  </g>

  <!-- morcegos voando -->
  <g transform="translate(0 70)"><g class="voo"><use href="#morcego" transform="scale(0.22)" fill="#94a3b8" opacity=".5"/></g></g>
  <g transform="translate(0 150)"><g class="voo voo2"><use href="#morcego" transform="scale(0.16)" fill="#94a3b8" opacity=".4"/></g></g>

  <!-- cidade -->
  <g fill="#0e1220">
    <path d="M0 360 V300 H40 V285 H90 V305 H130 V275 H175 V300 H230 V290 H280 V310 H330 V280 H360 V265 H400 V295 H450 V300 H500 V270 H540 V250 H560 V235 H580 V250 H600 V285 H650 V255 H700 V290 H740 V230 H760 V215 H790 V230 H800 V280 H850 V240 H900 V275 H940 V250 H970 V200 H985 V180 H995 V200 H1030 V260 H1080 V235 H1130 V280 H1170 V255 H1200 V360 Z"/>
  </g>
  <g fill="#ffd23f">
    <rect class="janela" x="548" y="262" width="5" height="7"/>
    <rect class="janela j2" x="568" y="248" width="5" height="7"/>
    <rect x="748" y="245" width="5" height="7" opacity=".8"/>
    <rect class="janela" x="772" y="240" width="5" height="7"/>
    <rect class="janela j2" x="986" y="215" width="5" height="7"/>
    <rect x="1005" y="230" width="5" height="7" opacity=".8"/>
    <rect class="janela" x="1010" y="275" width="5" height="7"/>
    <rect x="862" y="255" width="5" height="7" opacity=".6"/>
    <rect class="janela j2" x="1092" y="250" width="5" height="7"/>
    <rect x="370" y="280" width="5" height="7" opacity=".6"/>
    <rect class="janela" x="660" y="270" width="5" height="7"/>
  </g>

  <!-- nome -->
  <text class="titulo" x="70" y="160" font-size="104" letter-spacing="8" fill="#f5c518" filter="url(#brilho)">PXDRIK</text>
  <text class="texto" x="74" y="208" font-size="26" fill="#cbd5e1">Desenvolvedor · criador do LaCalle</text>
  <text class="texto" x="74" y="244" font-size="18" fill="#94a3b8" font-style="italic">O código sai melhor de madrugada.</text>
</svg>
