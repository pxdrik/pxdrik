# Gera todo dia o gráfico de contribuições animado (em amarelo) e publica na branch "output".
name: rastro

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/rastro-escuro.svg?palette=github-dark&color_snake=#f5c518&color_dots=#161b22,#3d3200,#7a6200,#b89200,#f5c518
            dist/rastro-claro.svg?color_snake=#b89200&color_dots=#ebedf0,#fff3b0,#ffe066,#f5c518,#b89200

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
